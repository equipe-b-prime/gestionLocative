spring.application.name=gestionLocative

# Port dynamique pour Render / Cloud (fallback 9090 en local)
server.port=${PORT:8080}

# Configuration Base de données (Variables d'environnement en prod / fallback local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_locative}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update

# Documentation Swagger UI & Redoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.redoc.path=/redoc.html
springdoc.api-docs.enabled=true